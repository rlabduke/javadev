name: Build Installers

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            ant-target: jpackage-mac
            jogl-os: macosx-universal
            probe-binary: probe
          - os: macos-15-intel
            platform: mac
            arch: x86_64
            ant-target: jpackage-mac
            jogl-os: macosx-universal
            probe-binary: probe
          - os: windows-latest
            platform: win
            arch: x86_64
            ant-target: jpackage-win
            jogl-os: windows-amd64
            probe-binary: probe.exe
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            ant-target: jpackage-nix
            jogl-os: linux-amd64
            probe-binary: probe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout KiNG
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build probe from source
        uses: actions/checkout@v4
        with:
          repository: rlabduke/probe
          path: probe-src

      - name: Compile probe
        run: |
          cd probe-src
          cmake .
          cmake --build . --config Release

      - name: Install probe binary (Unix)
        if: runner.os != 'Windows'
        run: cp probe-src/${{ matrix.probe-binary }} lib/rlab/${{ matrix.platform }}/probe

      - name: Install probe binary (Windows)
        if: runner.os == 'Windows'
        run: copy probe-src\Release\probe.exe lib\rlab\win\probe.exe

      - name: Download JOGL 2.6 natives
        run: |
          curl -sL -o lib/jogl2.6/jogl-all-natives-${{ matrix.jogl-os }}.jar \
            https://repo1.maven.org/maven2/org/jogamp/jogl/jogl-all/2.6.0/jogl-all-2.6.0-natives-${{ matrix.jogl-os }}.jar
          curl -sL -o lib/jogl2.6/gluegen-rt-natives-${{ matrix.jogl-os }}.jar \
            https://repo1.maven.org/maven2/org/jogamp/gluegen/gluegen-rt/2.6.0/gluegen-rt-2.6.0-natives-${{ matrix.jogl-os }}.jar
        shell: bash

      - name: Build KiNG
        run: ant build
        working-directory: king

      - name: Build plugin JARs
        run: |
          ant -f chiropraxis/build.xml build
          ant -f extratools/build.xml build
          ant -f rdcvis/build.xml build

      - name: Import Apple certificate
        if: matrix.platform == 'mac'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/certificate.p12

      - name: Extract version from tag
        id: version
        run: |
          # Strip 'v' prefix: v2.25-rc6 -> 2.25-rc6
          TAG="${GITHUB_REF_NAME#v}"
          # Numeric only for jpackage (requires X.Y.Z): 2.25-rc6 -> 2.25
          NUMERIC="${TAG%%-*}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "jpackage_version=${NUMERIC}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build installer
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.platform }}" = "mac" ]; then
            EXTRA_FLAGS="-Dmac.sign.identity=${{ secrets.APPLE_SIGNING_IDENTITY }}"
          fi
          ant "-Dversion=${{ steps.version.outputs.version }}" \
            "-Djpackage.version=${{ steps.version.outputs.jpackage_version }}" \
            ${EXTRA_FLAGS:+"$EXTRA_FLAGS"} ${{ matrix.ant-target }}
        working-directory: king
        shell: bash

      - name: Notarize DMG
        if: matrix.platform == 'mac'
        run: |
          DMG=$(find king/dist -name '*.dmg' | head -1)
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --wait
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"

      - name: Cleanup keychain
        if: matrix.platform == 'mac' && always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true

      - name: Collect installer files
        run: |
          mkdir -p king/installers
          find king/dist -maxdepth 2 \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \) ! -name 'KiNG-*.dmg' -exec cp {} king/installers/ \;
          ls -la king/installers/
        shell: bash

      - name: Add architecture to macOS DMG filename
        if: matrix.platform == 'mac'
        run: |
          cd king/installers
          for f in *.dmg; do
            mv "$f" "${f/.macosx./.macosx-${{ matrix.arch }}.}"
          done
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: king/installers/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete existing release if re-running
        run: gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
